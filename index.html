<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RoadFix — Report road defects in Orange, NSW</title>
    <meta name="description" content="Report potholes and road damage in Orange, NSW. Pin it on the map, add a photo, and follow the repair from report to council-verified fix." />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="RoadFix" />
    <meta name="geo.region" content="AU-NSW" />
    <meta name="geo.placename" content="Orange" />

    <!-- Apply the saved theme before the first paint, so dark-mode users don't see a white flash -->
    <script>
      try { if (localStorage.getItem('roadfix-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080D18" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Start connecting to the database and map servers while the page loads -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://c.tile.openstreetmap.org" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social previews (Facebook, LinkedIn, X, messaging apps). Absolute URLs are filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoadFix" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="RoadFix — Report road defects in Orange, NSW" />
    <meta property="og:description" content="Report potholes and road damage in Orange, NSW. Pin it on the map, add a photo, and follow the repair from report to council-verified fix." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RoadFix logo — a road with a traffic cone" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoadFix — Report road defects in Orange, NSW" />
    <meta name="twitter:description" content="Report potholes and road damage in Orange, NSW. Pin it on the map, add a photo, and follow the repair from report to council-verified fix." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data: tells search engines what this site is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "RoadFix",
            "description": "Report potholes and road damage in Orange, NSW, and follow each repair to a council-verified fix.",
            "inLanguage": "en-AU"
          },
          {
            "@type": "GovernmentService",
            "name": "RoadFix road defect reporting",
            "serviceType": "Road defect reporting and repair tracking",
            "areaServed": { "@type": "City", "name": "Orange", "containedInPlace": { "@type": "State", "name": "New South Wales" } },
            "provider": { "@type": "GovernmentOrganization", "name": "Orange City Council" },
            "audience": { "@type": "Audience", "audienceType": "Residents of Orange, NSW" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:640px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.5">
        <h1>RoadFix — Report road defects in Orange, NSW</h1>
        <p>RoadFix lets residents report potholes, cracks, flooding and other road damage to Orange City Council,
           and follow each repair from report to council-verified fix. Please turn on JavaScript to use the map and report a defect.</p>
        <p>For immediate danger on the road, call 000.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
